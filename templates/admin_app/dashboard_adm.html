{% load static %}
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAMU 192</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <!-- Seu CSS (sobrescreve o Bootstrap onde precisar) -->
    <link rel="stylesheet" href="{% static 'css/adm.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">

    <script>
        const csrftoken = '{{ csrf_token }}';
    </script>
</head>

<body>
    <div class="top-bar d-flex justify-content-between align-items-center">
        <div class="logo-box d-flex align-items-center">
            <img src="{% static 'img/SAMU.png' %}" alt="Logo SAMU">
        </div>
    </div>

    <div class="menu-bar">
        <div class="welcome-text">
            Seja Bem Vindo,<br>
            <strong><span id="usr_name">{{ usr_name }}</span></strong>!
        </div>
    </div>

    <!-- container do Bootstrap + sua estrutura -->
    <div class="card-container container">
        <div class="card" onclick="abrirModal()">
            <img src="{% static 'img/image.png' %}" alt="Adicionar usuário">
            <p>Adicionar<br>novo usuário</p>
        </div>

        <a href="{% url 'admin_app:lista_usuarios' %}" class="card-link">
            <div class="card">
                <img src="{% static 'img/geren.png' %}" alt="Gerenciar usuários">
                <p>Gerenciar<br>usuário</p>
            </div>
        </a>

        <a href="{% url 'logout' %}" class="card-link">
            <div class="card">
                <img src="{% static 'img/sair.png' %}" alt="Sair">
                <p>SAIR</p>
            </div>
        </a>
    </div>

    <div id="addUserModal" class="modal">
        <div class="modal-content">
            <div class="fechar-box">
                <span class="fechar" onclick="fecharModal()">&times;</span>
            </div>
            <h2>Novo Usuário</h2>
            <input type="text" id="novoUsuarioNome" placeholder="Nome do usuário:" />
            <input type="password" id="novoUsuarioSenha" placeholder="Senha:" />
            <button class="add-btn">Adicionar</button>
        </div>
    </div>

    <!-- mensagem de feedback (agora dentro do body) -->
    <div id="mensagem" style="display:none; padding: 10px; margin: 10px 20px;" class="mensagem-sucesso"></div>

    <script src="{% static 'js/adm.js' %}"></script>

    <!-- Bootstrap JS Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>
</body>
</html>
