{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAMU 192 - Usuários</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <!-- Estilos do projeto (depois do Bootstrap para sobrescrever o visual) -->
    <link rel="stylesheet" href="{% static 'css/user.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .swal2-cancel {
            background-color: #4CAF50 !important;
            color: white !important;
            border: none !important;
            border-radius: 5px;
            padding: 8px 20px;
        }
    </style>
</head>

<body>
    <div class="top-bar d-flex justify-content-between align-items-center">
        <div class="logo-box">
            <a href="{% url 'admin_app:adm_inicial' %}">
                <img src="{% static 'img/SAMU.png' %}" alt="Logo SAMU">
            </a>
        </div>
    </div>

    <!-- container do Bootstrap + sua classe própria -->
    <div class="container page-container">
        <h2>Lista de Usuários</h2>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for usuario in usuarios %}
                <tr>
                    <td>{{ usuario.username }}</td>
                    <td class="text-center">
                        <!-- classes do Bootstrap + suas classes (visual continua seu) -->
                        <button
                            class="view-btn btn btn-sm"
                            onclick="abrirModalVerDados('{{ usuario.username }}')"
                        >
                            Redefinir Senha
                        </button>
                        <button
                            type="button"
                            class="delete-btn btn btn-sm"
                            onclick="confirmarExclusao('{{ usuario.id }}')"
                        >
                            Excluir
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

<!-- Modal de Redefinir senha -->
<div id="modalVerDados" class="modal">
    <div class="modal-conteudo">
        <span class="fechar" onclick="fecharModalVerDados()">&times;</span>

        <h2>Redefinir Senha</h2>

        <p class="modal-info">
            <strong>Usuário:</strong> <span id="verNome"></span>
        </p>

        <input
            type="password"
            id="redefinirSenha"
            class="input-modal"
            placeholder="Nova senha:"
        />

        <!-- AQUI VOLTA O onclick -->
        <button class="btn-adicionar btn" onclick="redefinirSenha()">
            Redefinir
        </button>
    </div>
</div>


    <!-- JS externo -->
    <script src="{% static 'js/user.js' %}"></script>

    <!-- Bootstrap JS Bundle (JS + Popper) -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>

    <!-- Script de exclusão -->
    <script>
        function confirmarExclusao(usuarioId) {
            Swal.fire({
                title: 'Tem certeza?',
                text: "Essa ação não pode ser desfeita.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sim, excluir!',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#d33',
                customClass: {
                    cancelButton: 'swal2-cancel',
                    confirmButton: 'swal2-confirm'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = `/adm/excluir-usuario/${usuarioId}/`;

                    const csrfToken = '{{ csrf_token }}';
                    const csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = 'csrfmiddlewaretoken';
                    csrfInput.value = csrfToken;
                    form.appendChild(csrfInput);

                    document.body.appendChild(form);
                    form.submit();
                }
            });
        }
    </script>
</body>
</html>
